name: Deploy Multi Website Laravel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}

          script: |

            export NVM_DIR="$HOME/.nvm"

            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            fi


            echo "=============================="
            echo "DEPLOY WEBSITE 1"
            echo "=============================="

            cd /home/simak.uml.ac.id/public_html

            git config --global --add safe.directory /home/simak.uml.ac.id/public_html

            git pull origin main

            composer install --no-dev --optimize-autoloader

            npm install
            npm run build

            php artisan migrate --force

            php artisan optimize:clear
            php artisan optimize

            php artisan storage:link || true

            chmod -R 775 storage
            chmod -R 775 bootstrap/cache


            echo "=============================="
            echo "DEPLOY WEBSITE 2"
            echo "=============================="

            cd /home/simak.projectyai.ac.id/public_html

            git config --global --add safe.directory /home/simak.projectyai.ac.id/public_html

            git pull origin main

            composer install --no-dev --optimize-autoloader

            npm install
            npm run build

            php artisan migrate --force

            php artisan optimize:clear
            php artisan optimize

            php artisan storage:link || true

            chmod -R 775 storage
            chmod -R 775 bootstrap/cache


            echo "=============================="
            echo "DEPLOY SELESAI"
            echo "=============================="